[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchforge"
version = "0.1.0"
description = "An evidence-grounded runtime for reproducible research workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ResearchForge contributors" }]
dependencies = [
  "click>=8.1,<9",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
researchforge = "researchforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/researchforge"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=researchforge --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["researchforge"]

[tool.bandit]
exclude_dirs = ["tests"]
